name: watch-nse-filings

# Triggered every 5 minutes by an external cron (cron-job.org) calling this
# workflow's workflow_dispatch endpoint, not by GitHub's own `schedule`
# trigger. `schedule` is best-effort and was observed drifting badly in
# practice (delays growing from ~19min to over an hour between runs) — an
# explicit workflow_dispatch call runs immediately instead of sitting in
# GitHub's scheduler queue.
on:
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new filings
        env:
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python check_and_dispatch.py

      - name: Persist last-seen state
        run: |
          git config user.name "nse-filing-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: last-seen filing timestamp"
            git push
          fi
